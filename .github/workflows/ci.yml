name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Anything shipped to visitors must be clean; dev-only tooling (the eslint
      # chain) fails only on high or critical, since its moderate advisories
      # often wait weeks for an upstream release.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
