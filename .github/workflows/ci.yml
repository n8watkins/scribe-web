name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Anything shipped to visitors must be clean; dev-only tooling (the eslint
      # chain) fails only on high or critical, since its moderate advisories
      # often wait weeks for an upstream release.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
